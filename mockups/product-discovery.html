<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Product Discovery — Clickable Mockup</title>
<style>
  :root{
    --bg:#f5f6fb; --card:#ffffff; --ink:#1f2430; --muted:#6b7280;
    --primary:#4f46e5; --primary-600:#4338ca; --primary-050:#eef2ff;
    --border:#e5e7eb; --star:#f59e0b; --green:#059669; --amber:#d97706; --red:#dc2626;
    --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.1);
    --radius:14px;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}
  a{color:inherit;text-decoration:none}
  img{display:block;max-width:100%}
  button{font:inherit;cursor:pointer}
  .banner{background:linear-gradient(90deg,#4f46e5,#7c3aed);color:#fff;font-size:12.5px;text-align:center;padding:6px 12px;letter-spacing:.2px}

  header.top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--border);box-shadow:var(--shadow)}
  .bar{max-width:1160px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;cursor:pointer}
  .logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#4f46e5,#7c3aed);display:grid;place-items:center;color:#fff;font-weight:800}
  .search{flex:1;min-width:220px;position:relative}
  .search input{width:100%;padding:11px 14px 11px 38px;border:1px solid var(--border);border-radius:11px;background:#fbfbfe;font-size:14.5px;outline:none}
  .search input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-050)}
  .search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.5}
  .cart{width:40px;height:40px;border-radius:11px;border:1px solid var(--border);background:#fff;display:grid;place-items:center;position:relative}
  .cart .dot{position:absolute;top:-5px;right:-5px;background:var(--primary);color:#fff;font-size:11px;min-width:18px;height:18px;border-radius:10px;display:grid;place-items:center;padding:0 4px}

  main{max-width:1160px;margin:0 auto;padding:22px 18px 60px}
  .controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  select{padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:#fff;font-size:14px;outline:none}
  select:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-050)}
  .count{color:var(--muted);font-size:13.5px;margin-left:auto}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .chip{font-size:12.5px;padding:6px 11px;border-radius:999px;border:1px solid var(--border);background:#fff;color:var(--muted)}
  .chip.active{background:var(--primary);border-color:var(--primary);color:#fff}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:18px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);cursor:pointer;transition:transform .12s ease,box-shadow .12s ease}
  .card:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(16,24,40,.12)}
  .thumb{aspect-ratio:4/3;background:#eef0f6;position:relative;overflow:hidden}
  .thumb img{width:100%;height:100%;object-fit:cover}
  .disc{position:absolute;top:10px;left:10px;background:var(--red);color:#fff;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:8px}
  .cbody{padding:12px 13px 14px}
  .ctitle{font-weight:650;font-size:14.5px;line-height:1.25;margin:0 0 3px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
  .cbrand{color:var(--muted);font-size:12.5px;margin-bottom:8px}
  .priceRow{display:flex;align-items:baseline;gap:8px}
  .price{font-weight:800;font-size:16px}
  .old{color:var(--muted);text-decoration:line-through;font-size:12.5px}
  .meta{display:flex;align-items:center;justify-content:space-between;margin-top:9px}
  .stars{color:var(--star);font-size:12.5px}
  .stars b{color:var(--ink);margin-left:3px}
  .badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px}
  .b-in{background:#ecfdf5;color:var(--green)} .b-low{background:#fffbeb;color:var(--amber)} .b-out{background:#fef2f2;color:var(--red)}

  /* pagination */
  .pager{display:flex;justify-content:center;align-items:center;gap:6px;margin:28px 0 4px;flex-wrap:wrap}
  .pg{min-width:38px;height:38px;padding:0 10px;border:1px solid var(--border);background:#fff;border-radius:10px;font-weight:600;color:var(--ink)}
  .pg.active{background:var(--primary);border-color:var(--primary);color:#fff}
  .pg:disabled{opacity:.4;cursor:not-allowed}
  .pg.gap{border:none;background:transparent;cursor:default;min-width:20px}

  /* states */
  .center{display:grid;place-items:center;min-height:44vh;text-align:center;color:var(--muted)}
  .spinner{width:46px;height:46px;border:4px solid var(--primary-050);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:14px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .empty-ic,.err-ic{font-size:44px;margin-bottom:10px}
  .btn{background:var(--primary);color:#fff;border:none;padding:10px 16px;border-radius:10px;font-weight:600}
  .btn.ghost{background:#fff;color:var(--primary);border:1px solid var(--primary)}
  .sk{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
  .sk .b{background:linear-gradient(90deg,#eef0f6,#f7f8fc,#eef0f6);background-size:200% 100%;animation:sh 1.2s infinite}
  @keyframes sh{to{background-position:-200% 0}}
  .sk .b1{aspect-ratio:4/3}.sk .b2{height:14px;margin:12px 13px 8px;border-radius:6px}.sk .b3{height:12px;width:60%;margin:0 13px 14px;border-radius:6px}

  /* detail */
  .back{display:inline-flex;align-items:center;gap:7px;color:var(--muted);font-size:14px;margin-bottom:16px}
  .back:hover{color:var(--primary)}
  .detail{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:34px}
  .gallery .main{aspect-ratio:4/3;border-radius:var(--radius);overflow:hidden;border:1px solid var(--border);background:#eef0f6}
  .gallery .main img{width:100%;height:100%;object-fit:cover}
  .thumbs{display:flex;gap:10px;margin-top:12px}
  .thumbs .t{width:76px;height:64px;border-radius:10px;overflow:hidden;border:2px solid var(--border);cursor:pointer}
  .thumbs .t.active{border-color:var(--primary)}
  .thumbs .t img{width:100%;height:100%;object-fit:cover}
  .breadcrumb{color:var(--muted);font-size:13px;margin-bottom:6px}
  .dtitle{font-size:26px;font-weight:800;margin:0 0 6px}
  .dbrand{color:var(--muted);margin-bottom:12px}
  .dprice{display:flex;align-items:baseline;gap:10px;margin:14px 0}
  .dprice .p{font-size:28px;font-weight:800}
  .dprice .o{color:var(--muted);text-decoration:line-through}
  .dprice .save{background:#fef2f2;color:var(--red);font-weight:700;font-size:12.5px;padding:4px 9px;border-radius:8px}
  .desc{color:#374151;line-height:1.6;margin:14px 0 18px}
  .buyrow{display:flex;gap:12px;margin:18px 0}
  .facts{border-top:1px solid var(--border);margin-top:18px;padding-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:10px 20px;font-size:13.5px}
  .facts div{display:flex;justify-content:space-between;gap:10px}
  .facts span{color:var(--muted)}
  .reviews{max-width:1160px;margin:36px auto 0}
  .reviews h3{font-size:18px;margin:0 0 14px}
  .rev{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:12px}
  .rev .h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .rev .nm{font-weight:700}
  .rev .dt{color:var(--muted);font-size:12.5px}
  .rev .cm{color:#374151;line-height:1.5}

  /* dev toolbar */
  .devbar{position:fixed;bottom:0;left:0;right:0;background:#111827;color:#e5e7eb;font-size:12.5px;display:flex;align-items:center;gap:10px;padding:8px 14px;z-index:50;flex-wrap:wrap}
  .devbar b{color:#fff} .devbar .sp{flex:1}
  .devbar button{background:#374151;color:#e5e7eb;border:1px solid #4b5563;border-radius:8px;padding:5px 10px}
  .devbar button.on{background:var(--primary);border-color:var(--primary);color:#fff}

  /* toasts */
  .toastwrap{position:fixed;top:16px;right:16px;z-index:100;display:flex;flex-direction:column;gap:8px}
  .toast{background:#111827;color:#fff;padding:11px 16px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.22);font-size:14px;font-weight:600;opacity:0;transform:translateY(-8px);transition:opacity .25s ease,transform .25s ease}
  .toast.ok{background:#065f46}.toast.show{opacity:1;transform:translateY(0)}

  /* cart drawer */
  #cartdrawer{display:none} #cartdrawer.open{display:block}
  .cart-ov{position:fixed;inset:0;background:rgba(17,24,39,.45);z-index:60;opacity:0;animation:fade .2s forwards}
  @keyframes fade{to{opacity:1}}
  .cart-panel{position:fixed;top:0;right:0;height:100%;width:370px;max-width:92vw;background:#fff;z-index:61;box-shadow:-8px 0 30px rgba(0,0,0,.18);display:flex;flex-direction:column;transform:translateX(100%);animation:slidein .25s forwards}
  @keyframes slidein{to{transform:translateX(0)}}
  .cart-head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--border);font-size:16px}
  .cart-x{background:none;border:none;font-size:18px;color:var(--muted);cursor:pointer}
  .cart-body{flex:1;overflow:auto;padding:6px 14px}
  .cart-item{display:flex;gap:11px;padding:12px 4px;border-bottom:1px solid var(--border)}
  .cart-item img{width:56px;height:56px;border-radius:9px;object-fit:cover}
  .ci-main{flex:1;min-width:0}
  .ci-t{font-weight:650;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ci-b{color:var(--muted);font-size:13px;margin-top:3px}
  .ci-r{text-align:right}.ci-lt{font-weight:700}
  .ci-rm{background:none;border:none;color:var(--red);font-size:12.5px;margin-top:6px;cursor:pointer}
  .cart-empty{text-align:center;color:var(--muted);padding:52px 0;font-size:34px}.cart-empty p{font-size:14px;margin-top:8px}
  .cart-foot{border-top:1px solid var(--border);padding:16px 18px}
  .cart-sub{display:flex;justify-content:space-between;margin-bottom:12px;font-size:15px}
  .cart-note{color:var(--muted);font-size:12px;text-align:center;margin-top:8px}

  @media(max-width:760px){ .detail{grid-template-columns:1fr;gap:22px} .facts{grid-template-columns:1fr} }
</style>
</head>
<body>
  <div class="banner">🧪 Low-fidelity clickable mockup — baseline for the Product Discovery frontend. Routing, search, filters &amp; states are interactive; visuals are a starting point.</div>
  <div id="app"></div>

  <div class="devbar">
    <b>Preview states:</b>
    <button data-state="normal" class="on">Normal</button>
    <button data-state="loading">Loading</button>
    <button data-state="empty">Empty</button>
    <button data-state="error">Error</button>
    <span class="sp"></span>
    <button data-nav="#/unauthorized">Unauthorized page</button>
    <button data-nav="#/products/9999">404 / not found</button>
  </div>

  <div id="toast" class="toastwrap"></div>
  <div id="cartdrawer"></div>

<script>
/* ---------- data (images verified on images.unsplash.com) ---------- */
const IMG = (id,w)=>`https://images.unsplash.com/photo-${id}?w=${w}&q=80&auto=format&fit=crop`;
const CATEGORIES = ['smartphones','laptops','fragrances','furniture','groceries','home-decoration','headphones','footwear','accessories'];
const RAW = [
 [1,'iPhone 14 Pro','Apple','smartphones',999,12,4.7,34,'1592750475338-74b7b21085ab'],
 [2,'Galaxy S23 Ultra','Samsung','smartphones',1199,8,4.6,21,'1580910051074-3eb694886505'],
 [3,'Pixel 7','Google','smartphones',599,15,4.5,40,'1512499617640-c74ae3a79d37'],
 [4,'MacBook Pro 14"','Apple','laptops',1999,5,4.8,12,'1517336714731-489689fd1ca8'],
 [5,'ThinkPad X1 Carbon','Lenovo','laptops',1499,10,4.6,18,'1496181133206-80ce9b88a853'],
 [6,'ROG Zephyrus G14','Asus','laptops',1650,7,4.7,9,'1541807084-5c52b6b3adef'],
 [7,'iPad Pro 12.9"','Apple','laptops',1099,6,4.6,25,'1588872657578-7efd1f1555ed'],
 [8,'Rose Eau de Parfum','Chanel','fragrances',120,20,4.4,60,'1541643600914-78b084683601'],
 [9,'Oud Intense','Tom Ford','fragrances',240,5,4.7,22,'1594035910387-fea47794261f'],
 [10,'Citrus Bloom','Dior','fragrances',95,18,4.2,75,'1592945403244-b3fbafd7f539'],
 [11,'Amber Noir','YSL','fragrances',150,12,4.5,33,'1615634260167-c8cdede054de'],
 [12,'Modern Fabric Sofa','Urban','furniture',799,25,4.3,8,'1555041469-a586c61ea9bc'],
 [13,'Ergonomic Lounge Chair','Herman','furniture',450,10,4.6,14,'1567538096630-e0c55bd6374c'],
 [14,'Oak Dining Set','WoodCo','furniture',1200,15,4.4,5,'1567016432779-094069958ea5'],
 [15,'Walnut Coffee Table','WoodCo','furniture',320,8,4.2,11,'1538688525198-9b88f6f53126'],
 [16,'Extra Virgin Olive Oil','Bertolli','groceries',18,5,4.5,120,'1542838132-92c53300491e'],
 [17,'Organic Green Tea','Twinings','groceries',12,10,4.3,90,'1523049673857-eb18f1d7b578'],
 [18,'Fresh Veggies Box','FarmFresh','groceries',25,0,4.6,40,'1584308666744-24d5c474f2ae'],
 [19,'Ceramic Table Lamp','Nordic','home-decoration',85,12,4.4,26,'1517705008128-361805f42e86'],
 [20,'Noise-Cancel Headphones','Sony','headphones',349,15,4.7,30,'1505740420928-5e560c06d30e'],
 [21,'Studio Wireless','Beats','headphones',299,10,4.4,22,'1583394838336-acd977736f90'],
 [22,'Running Sneakers','Nike','footwear',129,20,4.5,55,'1542291026-7eec264c27ff'],
 [23,'Classic Leather Boots','Timberland','footwear',180,8,4.6,19,'1460353581641-37baddab0fa2'],
 [24,'Polarized Sunglasses','RayBan','accessories',160,12,4.3,44,'1572635196237-14b3f281503f'],
 [25,'Leather Tote Bag','Coach','accessories',220,10,4.5,17,'1548036328-c9fa89d128fa'],
 [26,'Minimalist Watch','Daniel W.','accessories',199,15,4.4,28,'1523275335684-37898b6baf30'],
 [27,'Smart Fitness Watch','Garmin','accessories',279,8,4.6,33,'1511707171634-5f897ff02aa9'],
];
const REVIEWERS=['Ayesha K.','John D.','Wei L.','Maria G.','Omar S.','Nina P.','Liam R.'];
const COMMENTS=['Exactly as described, great quality.','Fast delivery and works perfectly.','Good value for the price.','Looks premium, very happy.','Solid product, would buy again.','Better than I expected.'];
const P = RAW.map(r=>{
  const [id,title,brand,category,price,disc,rating,stock,img]=r;
  const old = disc>0 ? Math.round(price/(1-disc/100)) : null;
  const reviews = [0,1,2].map(i=>({
    name:REVIEWERS[(id+i)%REVIEWERS.length],
    rating: Math.min(5,Math.round(rating)+ (i%2?0:0)),
    comment:COMMENTS[(id+i)%COMMENTS.length],
    date:`2026-0${1+((id+i)%8)}-1${i}`
  }));
  return {id,title,brand,category,price,disc,rating,stock,img,old,
    desc:`The ${title} by ${brand} is a top pick in ${category.replace('-',' ')}. Thoughtfully designed for everyday use, it balances quality, durability and value — a dependable choice you can rely on.`,
    reviews};
});
const byId = id => P.find(p=>p.id===id);

/* ---------- helpers ---------- */
const PAGE_SIZE=12;
let forceState='normal';
let L={q:'',category:'',page:1};   // listing state (mirrors the URL)
let cart=[{id:1,qty:1},{id:4,qty:1},{id:8,qty:1}]; const wish=new Set(); // mockup-only cart + wishlist
let cartOpen=false;
const cartCount=()=>cart.reduce((n,i)=>n+i.qty,0);
function updateDot(){ const d=document.getElementById('cartdot'); if(d) d.textContent=cartCount(); }
function addToCart(p){ const it=cart.find(i=>i.id===p.id); if(it) it.qty++; else cart.push({id:p.id,qty:1}); updateDot(); toast('🛒 Added to cart',true); if(cartOpen) renderCart(); }
function openCart(){ cartOpen=true; renderCart(); }
function closeCart(){ cartOpen=false; const h=document.getElementById('cartdrawer'); if(h){h.classList.remove('open'); h.innerHTML='';} }
function renderCart(){
  const host=document.getElementById('cartdrawer'); if(!host) return;
  const items=cart.map(i=>({...byId(i.id),qty:i.qty}));
  const subtotal=items.reduce((s,p)=>s+p.price*p.qty,0);
  host.classList.add('open');
  host.innerHTML=`<div class="cart-ov" data-close></div><aside class="cart-panel">
    <div class="cart-head"><b>Your cart (${cartCount()})</b><button class="cart-x" data-close>✕</button></div>
    <div class="cart-body">${items.length? items.map(p=>`<div class="cart-item">
        <img src="${IMG(p.img,120)}" alt=""><div class="ci-main"><div class="ci-t">${esc(p.title)}</div><div class="ci-b">$${p.price} × ${p.qty}</div></div>
        <div class="ci-r"><div class="ci-lt">$${p.price*p.qty}</div><button class="ci-rm" data-rm="${p.id}">Remove</button></div></div>`).join('')
      : `<div class="cart-empty">🛒<p>Your cart is empty.</p></div>`}</div>
    <div class="cart-foot"><div class="cart-sub"><span>Subtotal</span><b>$${subtotal}</b></div>
      <button class="btn" style="width:100%" data-checkout>Checkout</button>
      <div class="cart-note">Demo checkout — no real payment is taken.</div></div></aside>`;
  host.querySelectorAll('[data-close]').forEach(n=>n.onclick=closeCart);
  host.querySelectorAll('[data-rm]').forEach(n=>n.onclick=()=>{ cart=cart.filter(i=>String(i.id)!==n.dataset.rm); updateDot(); renderCart(); });
  const co=host.querySelector('[data-checkout]'); if(co) co.onclick=()=>{ if(!cart.length){ toast('Your cart is empty'); return; } cart=[]; updateDot(); toast('✅ Order placed!',true); closeCart(); };
}
let toastN=0;
function toast(msg,ok){
  const wrap=document.getElementById('toast'); if(!wrap)return;
  const t=document.createElement('div'); t.className='toast'+(ok?' ok':''); t.textContent=msg;
  wrap.appendChild(t); requestAnimationFrame(()=>t.classList.add('show'));
  setTimeout(()=>{ t.classList.remove('show'); setTimeout(()=>t.remove(),300); },2200);
}
const el = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const stars = r => { const f=Math.round(r); return '★★★★★☆☆☆☆☆'.slice(5-f,10-f); };
const stockBadge = s => s===0?`<span class="badge b-out">Out of stock</span>`: s<15?`<span class="badge b-low">Low stock</span>`:`<span class="badge b-in">In stock</span>`;

function filtered(){
  let list=P.slice();
  if(L.category) list=list.filter(p=>p.category===L.category);
  if(L.q){ const q=L.q.toLowerCase(); list=list.filter(p=>(p.title+' '+p.brand+' '+p.desc).toLowerCase().includes(q)); }
  return list;
}
function pageWindow(cur,total){
  if(total<=7) return Array.from({length:total},(_,i)=>i+1);
  const s=new Set([1,2,total-1,total,cur-1,cur,cur+1]);
  const arr=[...s].filter(n=>n>=1&&n<=total).sort((a,b)=>a-b);
  const out=[]; let prev=0;
  for(const n of arr){ if(n-prev>1) out.push('…'); out.push(n); prev=n; }
  return out;
}

/* ---------- router ---------- */
function parse(){
  const h=(location.hash||'#/products').slice(1);
  const [path,qs]=h.split('?');
  return {path:path||'/', params:new URLSearchParams(qs||'')};
}
function go(hash,{replace=false}={}){
  if(replace) history.replaceState(null,'',hash); else history.pushState(null,'',hash);
  render();
}
function listHash(){
  const p=new URLSearchParams();
  if(L.q) p.set('q',L.q);
  if(L.category) p.set('category',L.category);
  if(L.page>1) p.set('page',L.page);
  const s=p.toString();
  return '#/products'+(s?'?'+s:'');
}

/* ---------- render ---------- */
function render(){
  const {path,params}=parse();
  if(path.startsWith('/products/')){ return renderDetail(parseInt(path.split('/')[2],10)); }
  if(path==='/unauthorized'){ return renderUnauthorized(); }
  if(path==='/'||path==='/products'){
    L.q=params.get('q')||''; L.category=params.get('category')||''; L.page=Math.max(1,parseInt(params.get('page')||'1',10)||1);
    return renderList();
  }
  return renderNotFound('This page does not exist.');
}

function header(){
  return `
  <header class="top"><div class="bar">
    <div class="brand" data-link="#/products"><div class="logo">D</div><span>Discover</span></div>
    <div class="search"><span class="ic">🔎</span>
      <input id="q" type="text" placeholder="Search products…" value="${esc(L.q)}" autocomplete="off"/>
    </div>
    <button class="cart" title="Cart">🛒<span class="dot" id="cartdot">${cartCount()}</span></button>
  </div></header>`;
}

function renderList(){
  el.innerHTML = header()+`
  <main>
    <div class="controls">
      <label>Category
        <select id="cat">
          <option value="">All categories</option>
          ${CATEGORIES.map(c=>`<option value="${c}" ${c===L.category?'selected':''}>${c.replace('-',' ')}</option>`).join('')}
        </select>
      </label>
      <span class="count" id="count"></span>
    </div>
    <div id="results"></div>
  </main>`;
  // wire controls (built once; not re-created while typing so focus is kept)
  const q=el.querySelector('#q');
  q.addEventListener('input',e=>{ L.q=e.target.value; L.page=1; history.replaceState(null,'',listHash()); renderResults(); });
  el.querySelector('#cat').addEventListener('change',e=>{ L.category=e.target.value; L.page=1; go(listHash()); });
  el.querySelector('.brand').addEventListener('click',()=>go('#/products'));
  renderResults();
  // keep caret at end when navigating back into a search
  if(L.q){ q.focus(); q.setSelectionRange(q.value.length,q.value.length); }
}

function renderResults(){
  const box=el.querySelector('#results'); const count=el.querySelector('#count');
  if(forceState==='loading'){ count.textContent=''; box.innerHTML=`<div class="grid">${Array.from({length:8}).map(()=>`<div class="sk"><div class="b b1"></div><div class="b b2"></div><div class="b b3"></div></div>`).join('')}</div>`; return; }
  if(forceState==='error'){ count.textContent=''; box.innerHTML=`<div class="center"><div class="err-ic">⚠️</div><h3>Couldn't load products</h3><p>Something went wrong while fetching the catalog.</p><button class="btn" id="retry">Retry</button></div>`; box.querySelector('#retry').onclick=()=>setState('normal'); return; }

  const list=filtered();
  const totalPages=Math.max(1,Math.ceil(list.length/PAGE_SIZE));
  if(L.page>totalPages) L.page=totalPages;
  const start=(L.page-1)*PAGE_SIZE;
  const pageItems=(forceState==='empty')?[]:list.slice(start,start+PAGE_SIZE);

  if(pageItems.length===0){
    count.textContent='';
    const reason = L.q||L.category ? 'No products match your filters.' : 'No products found.';
    box.innerHTML=`<div class="center"><div class="empty-ic">🗂️</div><h3>${reason}</h3>
      <p>Try a different search or category.</p>
      ${(L.q||L.category)?`<button class="btn ghost" id="clear">Clear filters</button>`:''}</div>`;
    const c=box.querySelector('#clear'); if(c) c.onclick=()=>{ L.q='';L.category='';L.page=1; go('#/products'); };
    return;
  }

  count.textContent=`${list.length} product${list.length>1?'s':''}`+(L.category?` in ${L.category.replace('-',' ')}`:'')+(L.q?` for “${L.q}”`:'');
  box.innerHTML=`<div class="grid">${pageItems.map(card).join('')}</div>${pager(totalPages)}`;
  box.querySelectorAll('[data-id]').forEach(n=>n.addEventListener('click',()=>go('#/products/'+n.dataset.id)));
  box.querySelectorAll('[data-page]').forEach(n=>n.addEventListener('click',()=>{ const v=n.dataset.page; if(v==='…')return; L.page=parseInt(v,10); go(listHash()); window.scrollTo({top:0,behavior:'smooth'}); }));
}

function card(p){
  return `<article class="card" data-id="${p.id}">
    <div class="thumb">${p.disc>0?`<span class="disc">-${p.disc}%</span>`:''}<img loading="lazy" src="${IMG(p.img,500)}" alt="${esc(p.title)}"></div>
    <div class="cbody">
      <h3 class="ctitle">${esc(p.title)}</h3>
      <div class="cbrand">${esc(p.brand)}</div>
      <div class="priceRow"><span class="price">$${p.price}</span>${p.old?`<span class="old">$${p.old}</span>`:''}</div>
      <div class="meta"><span class="stars">${stars(p.rating)}<b>${p.rating}</b></span>${stockBadge(p.stock)}</div>
    </div>
  </article>`;
}

function pager(totalPages){
  if(totalPages<=1) return '';
  const cur=L.page;
  const nums=pageWindow(cur,totalPages).map(n=> n==='…'
    ? `<button class="pg gap" disabled>…</button>`
    : `<button class="pg ${n===cur?'active':''}" data-page="${n}">${n}</button>`).join('');
  return `<div class="pager">
    <button class="pg" data-page="${cur-1}" ${cur<=1?'disabled':''}>‹ Prev</button>
    ${nums}
    <button class="pg" data-page="${cur+1}" ${cur>=totalPages?'disabled':''}>Next ›</button>
  </div>`;
}

function renderDetail(id){
  const p=byId(id);
  if(!p) return renderNotFound('We couldn’t find that product.');
  const gal=P.filter(x=>x.category===p.category).slice(0,4); if(!gal.includes(p)) gal.unshift(p);
  const imgs=[p,...gal.filter(x=>x!==p)].slice(0,4);
  el.innerHTML=header()+`
  <main>
    <a class="back" data-link="${listHash()}">‹ Back to products</a>
    <div class="detail">
      <div class="gallery">
        <div class="main"><img id="mainimg" src="${IMG(p.img,900)}" alt="${esc(p.title)}"></div>
        <div class="thumbs">${imgs.map((x,i)=>`<div class="t ${i===0?'active':''}" data-src="${IMG(x.img,900)}"><img src="${IMG(x.img,200)}" alt=""></div>`).join('')}</div>
      </div>
      <div class="info">
        <div class="breadcrumb">${p.category.replace('-',' ')}</div>
        <h1 class="dtitle">${esc(p.title)}</h1>
        <div class="dbrand">by ${esc(p.brand)}</div>
        <div class="stars">${stars(p.rating)} <b style="color:var(--ink)">${p.rating}</b> <span style="color:var(--muted);font-size:13px">(${p.reviews.length} reviews)</span></div>
        <div class="dprice"><span class="p">$${p.price}</span>${p.old?`<span class="o">$${p.old}</span><span class="save">Save ${p.disc}%</span>`:''}</div>
        <div>${stockBadge(p.stock)} <span style="color:var(--muted);font-size:13px;margin-left:6px">${p.stock} left</span></div>
        <p class="desc">${esc(p.desc)}</p>
        <div class="buyrow"><button class="btn" id="addcart">Add to cart</button><button class="btn ghost" id="wish">${wish.has(p.id)?'♥ Wishlisted':'♡ Wishlist'}</button></div>
        <div class="facts">
          <div><span>Brand</span><b>${esc(p.brand)}</b></div>
          <div><span>Category</span><b>${p.category.replace('-',' ')}</b></div>
          <div><span>SKU</span><b>PD-${1000+p.id}</b></div>
          <div><span>Shipping</span><b>2–4 days</b></div>
        </div>
      </div>
    </div>
    <section class="reviews">
      <h3>Reviews (${p.reviews.length})</h3>
      ${p.reviews.map(r=>`<div class="rev"><div class="h"><span class="nm">${esc(r.name)}</span><span class="dt">${r.date}</span></div>
        <div class="stars">${stars(r.rating)}</div><div class="cm">${esc(r.comment)}</div></div>`).join('')}
    </section>
  </main>`;
  el.querySelectorAll('.thumbs .t').forEach(t=>t.addEventListener('click',()=>{
    el.querySelector('#mainimg').src=t.dataset.src;
    el.querySelectorAll('.thumbs .t').forEach(x=>x.classList.remove('active')); t.classList.add('active');
  }));
  el.querySelector('#addcart').onclick=()=>addToCart(p);
  const w=el.querySelector('#wish');
  w.onclick=()=>{
    if(wish.has(p.id)){ wish.delete(p.id); w.textContent='♡ Wishlist'; toast('Removed from wishlist'); }
    else { wish.add(p.id); w.textContent='♥ Wishlisted'; toast('♥ Added to wishlist',true); }
  };
  window.scrollTo({top:0});
}

function renderUnauthorized(){
  el.innerHTML=header()+`<main><div class="center">
    <div class="empty-ic">🔒</div><h2>Unauthorized</h2>
    <p>You need to be signed in to view the catalog.</p>
    <button class="btn" data-link="#/products">Go to products</button>
  </div></main>`;
}
function renderNotFound(msg){
  el.innerHTML=header()+`<main><div class="center">
    <div class="empty-ic">🔍</div><h2>404 — Not found</h2>
    <p>${esc(msg)}</p>
    <button class="btn" data-link="#/products">Back to products</button>
  </div></main>`;
}

/* ---------- global wiring ---------- */
function setState(s){
  forceState=s;
  document.querySelectorAll('.devbar [data-state]').forEach(b=>b.classList.toggle('on',b.dataset.state===s));
  const {path}=parse(); if(path==='/'||path==='/products') renderResults();
}
document.querySelector('.devbar').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b)return;
  if(b.dataset.state) setState(b.dataset.state);
  if(b.dataset.nav){ setState('normal'); go(b.dataset.nav); }
});
// delegated in-app navigation for [data-link]
document.body.addEventListener('click',e=>{
  if(e.target.closest('.cart')){ openCart(); return; }
  const a=e.target.closest('[data-link]'); if(!a)return; e.preventDefault(); go(a.getAttribute('data-link'));
});
window.addEventListener('popstate',render);
if(!location.hash) history.replaceState(null,'','#/products');
render();
</script>
</body>
</html>
